<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4338ca" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 배경 둥근 사각형 -->
  <rect width="128" height="128" rx="28" ry="28" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- 상단 광택 -->
  <rect width="128" height="64" rx="28" ry="28" fill="url(#shine)"/>

  <!-- 말풍선 몸체 -->
  <rect x="18" y="22" width="92" height="62" rx="14" ry="14" fill="#ffffff" opacity="0.95"/>

  <!-- 말풍선 꼬리 -->
  <polygon points="36,84 26,102 52,84" fill="#ffffff" opacity="0.95"/>

  <!-- AI 텍스트 -->
  <text x="64" y="65" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="36" font-weight="800" text-anchor="middle" fill="url(#bg)" letter-spacing="-1">AI</text>

  <!-- 하단 점 3개 (Gemini·Claude·ChatGPT 상징) -->
  <circle cx="82" cy="108" r="5.5" fill="#4ade80"/>
  <circle cx="96" cy="108" r="5.5" fill="#facc15"/>
  <circle cx="110" cy="108" r="5.5" fill="#f87171"/>
</svg>
