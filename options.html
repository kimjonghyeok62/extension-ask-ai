<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>AI 쉬운 설명 — 설정</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 480px;
      margin: 40px auto;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif;
      font-size: 14px;
      color: #222;
      background: #fff;
    }

    h1 {
      font-size: 16px;
      font-weight: 700;
      color: #1a73e8;
      margin-bottom: 28px;
      padding-bottom: 14px;
      border-bottom: 2px solid #e8f0fe;
    }

    .section { margin-bottom: 24px; }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }

    .field-desc {
      font-size: 11px;
      color: #888;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    input[type="number"], select.opt-select {
      padding: 9px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      background: #fafafa;
    }
    input[type="number"] { width: 90px; }
    select.opt-select { width: 200px; }
    input[type="number"]:focus, select.opt-select:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px #e8f0fe;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      font-family: monospace;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px #e8f0fe; }

    .row-inline { display: flex; align-items: center; gap: 10px; margin-top: 2px; }

    button.save-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: #1a73e8;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button.save-btn:hover { background: #1558b0; }

    .row-btn { display: flex; gap: 8px; margin-top: 10px; }
    #toggle-vis {
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      background: #f1f3f4;
      color: #555;
    }
    #toggle-vis:hover { background: #e2e6ea; }

    .saved-ok {
      font-size: 11px;
      color: #1e7e34;
    }

    #status {
      margin-top: 14px;
      min-height: 20px;
      font-size: 12px;
      color: #888;
    }
    #status.ok  { color: #1e7e34; }
    #status.err { color: #c62828; }

    .info-box {
      margin-top: 32px;
      padding: 12px 14px;
      background: #f8f9ff;
      border-left: 3px solid #1a73e8;
      border-radius: 0 8px 8px 0;
      font-size: 12px;
      color: #555;
      line-height: 1.7;
    }
    .info-box a { color: #1a73e8; text-decoration: none; }
    .info-box a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>AI 쉬운 설명 — 설정</h1>

  <div class="section">
    <div class="field-label">툴바 활성 최소 글자 수</div>
    <div class="field-desc">텍스트를 드래그할 때 이 글자 수 이상이어야 툴바가 나타납니다. (기본: 10)</div>
    <div class="row-inline">
      <input type="number" id="min-chars" min="1" max="200" value="10">
      <button class="save-btn" id="save-min-chars">저장</button>
      <span class="saved-ok" id="min-chars-ok"></span>
    </div>
  </div>

  <div class="section">
    <div class="field-label">창 분할 비율 (내 창 : AI 창)</div>
    <div class="field-desc">AI 버튼 클릭 시 화면을 나누는 비율입니다.</div>
    <div class="row-inline">
      <select class="opt-select" id="split-ratio">
        <option value="0.75">75 : 25 (기본)</option>
        <option value="0.70">70 : 30</option>
        <option value="0.65">65 : 35</option>
        <option value="0.60">60 : 40</option>
      </select>
      <button class="save-btn" id="save-split">저장</button>
      <span class="saved-ok" id="split-ok"></span>
    </div>
  </div>

  <div class="section">
    <div class="field-label">Claude API 키</div>
    <div class="field-desc">
      한 번만 입력하면 영구 저장됩니다.<br>
      키는 이 기기의 확장프로그램 저장소에만 보관되며 외부로 전송되지 않습니다.
    </div>
    <input type="password" id="api-key" placeholder="sk-ant-api03-...">
    <div class="row-btn">
      <button class="save-btn" id="save">저장</button>
      <button id="toggle-vis">표시</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="info-box">
    API 키는 <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a>에서 발급받을 수 있습니다.<br>
    저장 후 페이지를 새로고침하면 바로 적용됩니다.
  </div>

  <script src="options.js"></script>
</body>
</html>
