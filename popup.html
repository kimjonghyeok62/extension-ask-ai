<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 250px;
      padding: 16px;
      font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      font-size: 13px;
      color: #222;
      background: #fff;
    }
    h1 { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #111; }
    .tip {
      padding: 10px 12px;
      background: #f5f8ff;
      border-left: 3px solid #4285F4;
      border-radius: 0 6px 6px 0;
      font-size: 12px;
      color: #555;
      line-height: 1.9;
    }
    .g { color: #2d74e6; font-weight: 700; }
    .c { color: #b85a1a; font-weight: 700; }
    strong { color: #111; }
  </style>
</head>
<body>
  <h1>AI 쉬운 설명</h1>
  <div class="tip">
    어느 웹페이지에서나 텍스트를<br>
    <strong>드래그</strong>하면 버튼이 나타납니다.<br><br>
    <span class="g">Gemini</span> 또는 <span class="c">Claude</span> 를 클릭하면<br>
    선택한 내용이 AI <strong>새 창</strong>에 자동 입력되어<br>
    쉽게 설명해달라고 요청합니다.
  </div>
</body>
</html>
