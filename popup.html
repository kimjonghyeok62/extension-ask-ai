<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 290px;
      padding: 16px;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif;
      font-size: 13px;
      color: #222;
      background: #fff;
    }

    h1 {
      font-size: 13px;
      font-weight: 700;
      color: #1a73e8;
      margin-bottom: 14px;
      letter-spacing: -0.3px;
    }

    /* 토글 행 */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .row label { font-weight: 600; }

    /* 토글 스위치 */
    .switch { position: relative; width: 42px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #ccc;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #1a73e8; }
    input:checked + .slider::before { transform: translateX(20px); }

    /* API 키 영역 */
    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
    }
    input[type="password"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
      outline: none;
    }
    input[type="password"]:focus { border-color: #1a73e8; }

    button {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 7px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      font-weight: 600;
    }
    #open-options {
      background: #f5f5f5;
      color: #555;
      font-weight: 500;
    }
    #open-options:hover { background: #e8e8e8; }

    hr { border: none; border-top: 1px solid #eee; margin: 14px 0; }

    #clear-cache {
      background: #f5f5f5;
      color: #555;
      font-weight: 500;
    }
    #clear-cache:hover { background: #e8e8e8; }

    #status {
      min-height: 18px;
      margin-top: 8px;
      font-size: 11px;
      color: #888;
      text-align: center;
    }

    .tip {
      margin-top: 12px;
      padding: 9px 10px;
      background: #f8f9ff;
      border-left: 3px solid #1a73e8;
      border-radius: 0 6px 6px 0;
      font-size: 11px;
      color: #555;
      line-height: 1.6;
    }
    .tip strong { color: #222; }
  </style>
</head>
<body>
  <h1>법 쉽게 설명</h1>

  <div class="row">
    <label for="toggle">하이라이트 활성화</label>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <button id="open-options">⚙ API 키 설정</button>

  <hr>

  <button id="clear-cache">캐시 초기화</button>
  <div id="status"></div>

  <div class="tip">
    법령 텍스트를 <strong>선택하거나 문단을 클릭</strong>하면<br>
    💬 버튼이 나타납니다. AI가 어려운 조문을<br>
    쉬운 말로 풀어드립니다.
  </div>

  <script src="popup.js"></script>
</body>
</html>
